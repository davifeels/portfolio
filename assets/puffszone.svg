<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="puffsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#081412" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Outer Geometry Gradient -->
    <linearGradient id="puffsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core Fill Gradient -->
    <linearGradient id="puffsCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Text Core Gradient -->
    <linearGradient id="puffsTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="puffsNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="85" fill="url(#puffsGlow)" />

  <!-- Emblem: High-Tech POS Cloud Terminal -->
  <g transform="translate(25, 20)">
    <!-- Hexagonal Terminal Outer Frame -->
    <path d="M 75,12 
             L 135,42 
             L 135,118 
             L 75,158 
             L 15,118 
             L 15,42 Z" 
          fill="#0a1518" 
          stroke="url(#puffsGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#puffsNeon)"/>

    <!-- Inner Frame Inset -->
    <path d="M 75,24 
             L 123,50 
             L 123,110 
             L 75,144 
             L 27,110 
             L 27,50 Z" 
          fill="rgba(15, 23, 42, 0.75)" 
          stroke="rgba(52, 211, 153, 0.35)" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>

    <!-- Stylized POS Cash Drawer & Cloud Symbol -->
    <!-- Screen Monitor / Register Frame -->
    <rect x="50" y="52" width="50" height="36" rx="6" fill="#061f1c" stroke="#34d399" stroke-width="2"/>
    <line x1="56" y1="62" x2="80" y2="62" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="70" x2="94" y2="70" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="56" y1="78" x2="74" y2="78" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Monitor Base / Cash Box -->
    <path d="M 70,88 L 80,88 L 86,102 L 64,102 Z" fill="#10b981"/>
    <rect x="42" y="102" width="66" height="20" rx="4" fill="url(#puffsCoreGrad)" stroke="#6ee7b7" stroke-width="1.2"/>
    
    <!-- Currency / NFC-e Spark Node -->
    <circle cx="75" cy="112" r="3.5" fill="#fef08a"/>

    <!-- Dynamic Pulsing Barcode Lines -->
    <line x1="38" y1="46" x2="48" y2="40" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="46" r="3" fill="#6ee7b7"/>

    <line x1="112" y1="46" x2="102" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="112" cy="46" r="3" fill="#38bdf8"/>

    <!-- Bottom Connectivity Pulse -->
    <path d="M 52,130 L 75,144 L 98,130" fill="none" stroke="url(#puffsGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(180, 20)">
    <!-- Main Title -->
    <text x="0" y="78" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="50" fill="#ffffff" letter-spacing="3">
      PUFFS<tspan fill="url(#puffsTextGrad)">ZONE</tspan>
    </text>

    <!-- Subtitle Badge -->
    <text x="2" y="112" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12.5" fill="#34d399" letter-spacing="1.8">
      COMMERCIAL MANAGEMENT &amp; CLOUD POS
    </text>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 128)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="24" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
      <text x="10" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#6ee7b7">JAVA 21 · SPRING BOOT 3</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="150" height="24" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <text x="185" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#7dd3fc">REACT 19 · POSTGRESQL</text>

      <!-- Pill 3 -->
      <rect x="335" y="0" width="100" height="24" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1"/>
      <text x="343" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#fcd34d">100% LIVE VPS</text>
    </g>
  </g>
</svg>
