<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="juriGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080e1d" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shield Border Gradient -->
    <linearGradient id="juriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gold Scales Gradient -->
    <linearGradient id="scalesGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Text Core Gradient -->
    <linearGradient id="juriTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <filter id="juriNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="85" fill="url(#juriGlow)" />

  <!-- Shield Outer Geometry: LegalTech Scales & Neural Grid -->
  <g transform="translate(25, 20)">
    <!-- Outer Shield Outline -->
    <path d="M 75,10 
             L 135,32 
             L 135,95 
             C 135,135 105,158 75,170 
             C 45,158 15,135 15,95 
             L 15,32 Z" 
          fill="#0a1224" 
          stroke="url(#juriGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#juriNeon)"/>

    <!-- Inner Shield Inset -->
    <path d="M 75,22 
             L 123,40 
             L 123,92 
             C 123,124 99,144 75,154 
             C 51,144 27,124 27,92 
             L 27,40 Z" 
          fill="rgba(15, 23, 42, 0.75)" 
          stroke="rgba(96, 165, 250, 0.35)" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>

    <!-- Scales of Justice Central Pillar -->
    <line x1="75" y1="36" x2="75" y2="125" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="75" cy="36" r="4.5" fill="#fde047"/>

    <!-- Balance Horizontal Crossbeam -->
    <line x1="45" y1="55" x2="105" y2="55" stroke="url(#scalesGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Scale Pan & Strings -->
    <line x1="45" y1="55" x2="35" y2="82" stroke="#93c5fd" stroke-width="1.2"/>
    <line x1="45" y1="55" x2="55" y2="82" stroke="#93c5fd" stroke-width="1.2"/>
    <path d="M 30,82 C 30,94 60,94 60,82 Z" fill="rgba(245, 158, 11, 0.3)" stroke="#fde047" stroke-width="1.8"/>

    <!-- Right Scale Pan & Strings (Elevated for predictive probability balance) -->
    <line x1="105" y1="55" x2="95" y2="78" stroke="#93c5fd" stroke-width="1.2"/>
    <line x1="105" y1="55" x2="115" y2="78" stroke="#93c5fd" stroke-width="1.2"/>
    <path d="M 90,78 C 90,90 120,90 120,78 Z" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="1.8"/>

    <!-- Neural Data Nodes / Decision Trees in Scales -->
    <circle cx="45" cy="85" r="3" fill="#fde047"/>
    <circle cx="105" cy="81" r="3" fill="#38bdf8"/>

    <!-- Scale Base / Pedestal -->
    <rect x="58" y="125" width="34" height="8" rx="2" fill="#fde047"/>

    <!-- Predictive Trajectory Arc (RAG AI Forecast) -->
    <path d="M 38,105 Q 75,138 112,105" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="112" cy="105" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(195, 20)">
    <!-- Main Title -->
    <text x="0" y="78" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="2.5">
      JURIMETRIA<tspan fill="url(#juriTextGrad)"> PREDITIVA</tspan>
    </text>

    <!-- Subtitle Badge -->
    <text x="3" y="112" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#60a5fa" letter-spacing="2">
      LEGALTECH AI &amp; PREDICTIVE ANALYTICS
    </text>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 130)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="25" rx="6" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1"/>
      <text x="12" y="17" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#93c5fd">PYTHON &amp; MACHINE LEARNING</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="155" height="25" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1"/>
      <text x="185" y="17" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#fde047">NLP &amp; JURISPRUDÊNCIA</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="135" height="25" rx="6" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1"/>
      <text x="348" y="17" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#c4b5fd">RAG + PGVECTOR</text>
    </g>
  </g>
</svg>
