<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="rekkonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#08140c" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shield Border Gradient -->
    <linearGradient id="rekkonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Scan Reticle Gradient -->
    <linearGradient id="scanReticle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Text Core Gradient -->
    <linearGradient id="rekkonTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <filter id="rekkonNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="85" fill="url(#rekkonGlow)" />

  <!-- Shield Outer Geometry: Biometric Mobile Shield -->
  <g transform="translate(25, 20)">
    <!-- Outer Shield Outline -->
    <path d="M 75,10 
             L 135,32 
             L 135,95 
             C 135,135 105,158 75,170 
             C 45,158 15,135 15,95 
             L 15,32 Z" 
          fill="#09140d" 
          stroke="url(#rekkonGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#rekkonNeon)"/>

    <!-- Inner Shield Inset -->
    <path d="M 75,22 
             L 123,40 
             L 123,92 
             C 123,124 99,144 75,154 
             C 51,144 27,124 27,92 
             L 27,40 Z" 
          fill="rgba(10, 24, 15, 0.75)" 
          stroke="rgba(132, 204, 22, 0.35)" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>

    <!-- Mobile Device Contour -->
    <rect x="52" y="46" width="46" height="78" rx="8" fill="#061f12" stroke="#84cc16" stroke-width="1.8"/>
    <!-- Phone Speaker Notch -->
    <line x1="68" y1="52" x2="82" y2="52" stroke="#bef264" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Biometric Face / Reticle Target Lock -->
    <!-- Reticle Corners -->
    <path d="M 60,65 L 60,60 L 65,60" fill="none" stroke="#a3e635" stroke-width="1.8"/>
    <path d="M 90,65 L 90,60 L 85,60" fill="none" stroke="#a3e635" stroke-width="1.8"/>
    <path d="M 60,95 L 60,100 L 65,100" fill="none" stroke="#a3e635" stroke-width="1.8"/>
    <path d="M 90,95 L 90,100 L 85,100" fill="none" stroke="#a3e635" stroke-width="1.8"/>

    <!-- ML Kit Neural Facial Feature Points -->
    <circle cx="68" cy="74" r="2.2" fill="#bef264"/>
    <circle cx="82" cy="74" r="2.2" fill="#bef264"/>
    <circle cx="75" cy="80" r="1.8" fill="#84cc16"/>
    <path d="M 70,88 Q 75,92 80,88" fill="none" stroke="#bef264" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Laser Horizontal Scan Beam -->
    <line x1="56" y1="80" x2="94" y2="80" stroke="#bef264" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Remote Lock Icon / Phone Home Bar -->
    <line x1="68" y1="116" x2="82" y2="116" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>

    <!-- Top Signal Waves -->
    <path d="M 65,34 C 70,30 80,30 85,34" fill="none" stroke="#bef264" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 60,28 C 70,22 80,22 90,28" fill="none" stroke="#a3e635" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(180, 20)">
    <!-- Main Title -->
    <text x="0" y="78" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="3">
      REKKON<tspan fill="url(#rekkonTextGrad)"> MDM</tspan>
    </text>

    <!-- Subtitle Badge -->
    <text x="2" y="112" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#a3e635" letter-spacing="1.8">
      REMOTE DEVICE MANAGEMENT &amp; BIOMETRICS
    </text>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 128)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="24" rx="6" fill="rgba(132, 204, 22, 0.12)" stroke="rgba(132, 204, 22, 0.35)" stroke-width="1"/>
      <text x="10" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#bef264">KOTLIN NATIVO · ANDROID</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="140" height="24" rx="6" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1"/>
      <text x="163" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#86efac">ML KIT BIOMETRICS</text>

      <!-- Pill 3 -->
      <rect x="305" y="0" width="130" height="24" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <text x="313" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#7dd3fc">NODE.JS WEBSOCKET</text>
    </g>
  </g>
</svg>
