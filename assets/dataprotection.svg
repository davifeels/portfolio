<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="dpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a1224" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shield Border Gradient -->
    <linearGradient id="dpShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Keyhole Core Gradient -->
    <linearGradient id="dpCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Text Core Gradient -->
    <linearGradient id="dpTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="dpNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="95" cy="100" r="85" fill="url(#dpGlow)" />

  <!-- Shield Outer Geometry: Federal Vault Emblem -->
  <g transform="translate(20, 20)">
    <!-- Outer Shield Outline -->
    <path d="M 75,10 
             L 135,32 
             L 135,95 
             C 135,135 105,158 75,170 
             C 45,158 15,135 15,95 
             L 15,32 Z" 
          fill="#0c1527" 
          stroke="url(#dpShieldGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#dpNeon)"/>

    <!-- Inner Shield Inset -->
    <path d="M 75,22 
             L 123,40 
             L 123,92 
             C 123,124 99,144 75,154 
             C 51,144 27,124 27,92 
             L 27,40 Z" 
          fill="rgba(15, 23, 42, 0.75)" 
          stroke="rgba(245, 158, 11, 0.35)" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>

    <!-- Federal Star / Cryptographic Nodes -->
    <circle cx="75" cy="42" r="3.5" fill="#fde047"/>
    <line x1="75" y1="46" x2="75" y2="65" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

    <line x1="48" y1="65" x2="65" y2="76" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="48" cy="65" r="3" fill="#38bdf8"/>

    <line x1="102" y1="65" x2="85" y2="76" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="102" cy="65" r="3" fill="#38bdf8"/>

    <!-- Golden Cryptographic Keyhole & Vault -->
    <circle cx="75" cy="85" r="14" fill="url(#dpCoreGrad)" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="75" cy="83" r="4.5" fill="#0f172a"/>
    <path d="M 72.5,84 L 77.5,84 L 79,94 L 71,94 Z" fill="#0f172a"/>

    <!-- Dual Wing Data Streams -->
    <path d="M 40,95 C 40,118 60,132 75,142 C 90,132 110,118 110,95" fill="none" stroke="url(#dpShieldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="62" y1="125" x2="75" y2="135" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <line x1="88" y1="125" x2="75" y2="135" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(175, 20)">
    <!-- Main Title: font-size 38 with generous right margin so the letter N never clips -->
    <text x="0" y="75" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="1.2">
      DATA<tspan fill="url(#dpTextGrad)">PROTECTION</tspan>
    </text>

    <!-- Subtitle Badge -->
    <text x="2" y="108" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#fbbf24" letter-spacing="1.5">
      GOVERNANÇA DE DADOS &amp; LGPD ART. 37
    </text>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 126)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="24" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1"/>
      <text x="10" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#fde047">ITI · AUTARQUIA FEDERAL</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="135" height="24" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <text x="165" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#7dd3fc">JAVA &amp; SPRING BOOT</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="125" height="24" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
      <text x="308" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#6ee7b7">RBAC &amp; AUDITORIA</text>
    </g>
  </g>
</svg>