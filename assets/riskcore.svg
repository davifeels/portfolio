<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="riskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080d19" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shield Border Gradient -->
    <linearGradient id="riskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Text Core Gradient -->
    <linearGradient id="riskTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="riskNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="85" fill="url(#riskGlow)" />

  <!-- Shield Outer Geometry: Crisis Radar Shield -->
  <g transform="translate(25, 20)">
    <!-- Outer Shield Outline -->
    <path d="M 75,10 
             L 135,32 
             L 135,95 
             C 135,135 105,158 75,170 
             C 45,158 15,135 15,95 
             L 15,32 Z" 
          fill="#0a1020" 
          stroke="url(#riskGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#riskNeon)"/>

    <!-- Inner Shield Inset -->
    <path d="M 75,22 
             L 123,40 
             L 123,92 
             C 123,124 99,144 75,154 
             C 51,144 27,124 27,92 
             L 27,40 Z" 
          fill="rgba(15, 23, 42, 0.75)" 
          stroke="rgba(34, 211, 238, 0.35)" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>

    <!-- Radar Concentric Rings -->
    <circle cx="75" cy="85" r="38" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="75" cy="85" r="24" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
    <circle cx="75" cy="85" r="10" fill="rgba(6, 182, 212, 0.2)" stroke="#22d3ee" stroke-width="1.5"/>

    <!-- Radar Crosshairs -->
    <line x1="75" y1="47" x2="75" y2="123" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <line x1="37" y1="85" x2="113" y2="85" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>

    <!-- AI Pulse Waveform / Threat Detector -->
    <path d="M 50,85 L 62,85 L 68,68 L 75,102 L 82,72 L 88,85 L 100,85" 
          fill="none" 
          stroke="#00f0ff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Active Threat Blip / Critical Alert Spark -->
    <circle cx="92" cy="65" r="4" fill="#f43f5e"/>
    <circle cx="92" cy="65" r="7" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.6"/>

    <!-- Bottom Pulse Lines -->
    <path d="M 55,130 L 75,144 L 95,130" fill="none" stroke="url(#riskGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(180, 20)">
    <!-- Main Title -->
    <text x="0" y="78" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="3">
      RISKCORE<tspan fill="url(#riskTextGrad)"> AI</tspan>
    </text>

    <!-- Subtitle Badge -->
    <text x="2" y="112" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#22d3ee" letter-spacing="1.8">
      REPUTATION DEFENSE &amp; CRISIS INTELLIGENCE
    </text>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 128)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="24" rx="6" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1"/>
      <text x="10" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#67e8f9">NEXT.JS 14 · TYPESCRIPT</text>

      <!-- Pill 2 -->
      <rect x="160" y="0" width="155" height="24" rx="6" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1"/>
      <text x="170" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#a5b4fc">POSTGRESQL · REDIS CACHE</text>

      <!-- Pill 3 -->
      <rect x="325" y="0" width="110" height="24" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1"/>
      <text x="333" y="16.5" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#fda4af">AI CRISIS RADAR</text>
    </g>
  </g>
</svg>
