<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <linearGradient id="nodeReact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a47"/>
      <stop offset="100%" stop-color="#071729"/>
    </linearGradient>

    <linearGradient id="nodeNginx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3323"/>
      <stop offset="100%" stop-color="#051c13"/>
    </linearGradient>

    <linearGradient id="nodeSpring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c3d"/>
      <stop offset="100%" stop-color="#0a1824"/>
    </linearGradient>

    <linearGradient id="nodePostgres" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2238"/>
      <stop offset="100%" stop-color="#0c111e"/>
    </linearGradient>

    <style>
      @keyframes flowDash {
        to { stroke-dashoffset: -20; }
      }
      .flow-line {
        stroke-dasharray: 6 4;
        animation: flowDash 1s linear infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', monospace;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="880" height="260" rx="14" fill="url(#archBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>

  <!-- Docker / VPS Outer Boundary -->
  <rect x="230" y="24" width="625" height="212" rx="12" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.45"/>
  <text x="245" y="44" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="0.5">
    🐳 DOCKER COMPOSE NETWORK // VPS LINUX (Ubuntu) · PUFFSZONE.TECH
  </text>

  <!-- Node 1: Client / Frontend -->
  <g transform="translate(25, 60)">
    <rect width="175" height="150" rx="12" fill="url(#nodeReact)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="87" cy="38" r="18" fill="#0284c7" opacity="0.2"/>
    <text x="87" y="43" text-anchor="middle" fill="#38bdf8" font-size="18">⚛️</text>
    <text x="87" y="74" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">CLIENT APP</text>
    <text x="87" y="93" text-anchor="middle" fill="#93c5fd" class="font-sans" font-size="11" font-weight="600">React 19 · TypeScript</text>
    <text x="87" y="110" text-anchor="middle" fill="#64748b" class="font-sans" font-size="10.5">Tailwind CSS · Vite</text>
    <rect x="25" y="124" width="125" height="18" rx="9" fill="#0369a1" opacity="0.3"/>
    <text x="87" y="136.5" text-anchor="middle" fill="#7dd3fc" class="font-mono" font-size="9" font-weight="600">HTTPS / REST API</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 200,135 L 255,135" stroke="#38bdf8" stroke-width="2" class="flow-line"/>
  <polygon points="255,131 262,135 255,139" fill="#38bdf8"/>

  <!-- Node 2: Nginx Gateway -->
  <g transform="translate(265, 60)">
    <rect width="165" height="150" rx="12" fill="url(#nodeNginx)" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="82" cy="38" r="18" fill="#059669" opacity="0.2"/>
    <text x="82" y="43" text-anchor="middle" fill="#10b981" font-size="18">🌐</text>
    <text x="82" y="74" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">REVERSE PROXY</text>
    <text x="82" y="93" text-anchor="middle" fill="#6ee7b7" class="font-sans" font-size="11" font-weight="600">Nginx 1.25 Engine</text>
    <text x="82" y="110" text-anchor="middle" fill="#64748b" class="font-sans" font-size="10.5">SSL / Let's Encrypt</text>
    <rect x="22" y="124" width="120" height="18" rx="9" fill="#047857" opacity="0.3"/>
    <text x="82" y="136.5" text-anchor="middle" fill="#6ee7b7" class="font-mono" font-size="9" font-weight="600">PORT 443 ➔ 8080</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 430,135 L 465,135" stroke="#10b981" stroke-width="2" class="flow-line"/>
  <polygon points="465,131 472,135 465,139" fill="#10b981"/>

  <!-- Node 3: Spring Boot Backend -->
  <g transform="translate(475, 60)">
    <rect width="180" height="150" rx="12" fill="url(#nodeSpring)" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="90" cy="38" r="18" fill="#6366f1" opacity="0.2"/>
    <text x="90" y="43" text-anchor="middle" fill="#818cf8" font-size="18">☕</text>
    <text x="90" y="74" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">BACKEND CORE</text>
    <text x="90" y="93" text-anchor="middle" fill="#c7d2fe" class="font-sans" font-size="11" font-weight="600">Java 21 · Spring Boot 3</text>
    <text x="90" y="110" text-anchor="middle" fill="#64748b" class="font-sans" font-size="10.5">Spring Security + JWT</text>
    <rect x="22" y="124" width="136" height="18" rx="9" fill="#4338ca" opacity="0.3"/>
    <text x="90" y="136.5" text-anchor="middle" fill="#c7d2fe" class="font-mono" font-size="9" font-weight="600">HikariCP Connection Pool</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 655,135 L 685,135" stroke="#818cf8" stroke-width="2" class="flow-line"/>
  <polygon points="685,131 692,135 685,139" fill="#818cf8"/>

  <!-- Node 4: PostgreSQL Database -->
  <g transform="translate(695, 60)">
    <rect width="145" height="150" rx="12" fill="url(#nodePostgres)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="72" cy="38" r="18" fill="#0284c7" opacity="0.2"/>
    <text x="72" y="43" text-anchor="middle" fill="#38bdf8" font-size="18">🐘</text>
    <text x="72" y="74" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">PERSISTENCE</text>
    <text x="72" y="93" text-anchor="middle" fill="#7dd3fc" class="font-sans" font-size="11" font-weight="600">PostgreSQL 16</text>
    <text x="72" y="110" text-anchor="middle" fill="#64748b" class="font-sans" font-size="10.5">Flyway Migrations</text>
    <rect x="18" y="124" width="110" height="18" rx="9" fill="#0369a1" opacity="0.3"/>
    <text x="72" y="136.5" text-anchor="middle" fill="#7dd3fc" class="font-mono" font-size="9" font-weight="600">ACID Relational</text>
  </g>
</svg>
